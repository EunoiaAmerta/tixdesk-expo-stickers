  L -148 -77
  A 28 28 0 0 1 -120 -105
  Z
" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- 2. Official Blue/Cyan Gradient body (tail is gradient) -->
    <path id="TicketBody" d="
  M 0 -105
  L 120 -105
  A 28 28 0 0 1 148 -77
  L 148 -35
  A 20 20 0 0 0 148 5
  L 148 52
  A 28 28 0 0 1 120 80
  L 20 80
  L 20 -24
  L 66 -24
  A 20 20 0 0 0 66 -64
