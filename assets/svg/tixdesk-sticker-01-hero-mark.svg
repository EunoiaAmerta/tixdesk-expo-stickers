  Z
" fill="url(#tixdeskGrad)" />

    <!-- 3. SOLID WHITE SYMMETRICAL 'T' GLYPH (100% solid white, stem = bar = 40px) -->
    <path id="TGlyph" d="
  M -66 -64
  L 66 -64
  A 20 20 0 0 1 66 -24
  L 20 -24
  L 20 80
  L -20 80
  L -20 -24
