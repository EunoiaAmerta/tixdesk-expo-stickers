    <path d="
      M -200 -195
      L 200 -195
      L 200 -60
      L 165 -60
      L 165 20
      L 200 20
      L 200 135
      L 40 135
      L -40 215
      L -125 215
      L -125 135
      L -200 135
      L -200 20
      L -165 20
      L -165 -60
      L -200 -60
