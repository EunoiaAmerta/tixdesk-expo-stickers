        <path d="M106.07 258.81 L104.23 262.5 L103.61 264.65 L103.61 265.87 L103.31 266.18 L103.31 293.52 L103 293.83 L103 296.29 L103.31 297.21 L106.69 298.13 L109.76 299.66 L110.99 300.59 L114.98 304.89 L117.13 309.8 L117.13 311.03 L117.44 311.34 L117.44 315.64 L117.13 315.94 L117.13 317.48 L116.52 319.32 L114.06 323.62 L110.68 327 L109.76 327.31 L108.22 328.54 L105.46 329.46 L104.54 329.46 L103.31 330.08 L103.31 360.49 L103.61 360.79 L103.92 363.25 L105.76 367.55 L107.61 370.01 L110.68 372.77 L116.21 375.54 L119.59 375.84 L119.89 376.15 L144.78 376.15 L145.39 376.46 L146.01 377.38 L146.01 405.03 L147.23 406.56 L149.08 406.87 L150.92 405.95 L177.34 379.22 L180.1 376.15 L180.72 374.92 L180.72 301.81 L179.79 300.28 L144.78 300.28 L143.24 299.66 L142.63 299.05 L142.01 297.51 L142.01 279.7 L142.63 278.16 L143.55 277.24 L144.47 277.24 L144.78 276.93 L245.22 276.93 L245.53 277.24 L246.45 277.24 L247.68 278.47 L247.68 279.39 L247.99 279.7 L247.99 297.82 L247.68 298.74 L246.15 299.97 L244.61 299.97 L244.3 300.28 L209.9 300.28 L208.98 301.51 L208.98 374.92 L209.59 375.84 L210.51 376.15 L270.72 376.15 L271.03 375.84 L272.87 375.84 L277.48 374 L280.55 371.85 L283.62 368.47 L285.46 365.09 L286.69 360.79 L286.69 330.08 L286.08 329.46 L282.09 328.54 L278.4 326.08 L275.63 323.32 L274.1 320.86 L272.87 317.79 L272.87 316.25 L272.56 315.94 L272.56 311.03 L272.87 310.72 L272.87 309.8 L274.1 306.42 L275.63 303.96 L280.24 299.66 L283.31 298.13 L286.08 297.51 L286.69 296.9 L286.69 265.57 L285.46 261.57 L283.62 258.2 L282.39 256.66 L279.32 253.89 L275.02 251.74 L274.1 251.74 L272.87 251.13 L271.03 251.13 L270.72 250.82 L120.51 250.82 L120.2 251.13 L117.74 251.13 L113.14 252.67 L109.76 254.82 Z" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.5" />
      </g>
    </g>

    <!-- BRAND WORDMARK "TixDesk" -->
    <text x="400" y="555"
          font-family="'Noto Sans', 'Segoe UI', system-ui, sans-serif"
          font-size="52" font-weight="900"
          letter-spacing="2"
          text-anchor="middle"
          fill="#FFFFFF">TixDesk</text>

    <!-- 3 PILL MODULES: TICKET • SLA • KB -->
    <g transform="translate(400, 620)">
      <!-- Ticket Pill -->
      <g transform="translate(-155, 0)">
        <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#1E293B" stroke="#3B82F6" stroke-width="1.8" />
        <circle cx="-32" cy="0" r="5" fill="#3B82F6" />
        <text x="-16" y="6" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="800" fill="#BFDBFE">Ticket</text>
      </g>

      <!-- SLA Pill -->
      <g transform="translate(0, 0)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1E293B" stroke="#06B6D4" stroke-width="1.8" />
        <circle cx="-28" cy="0" r="5" fill="#06B6D4" />
        <text x="-14" y="6" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="900" fill="#A5F3FC">SLA</text>
      </g>

      <!-- KB Pill -->
      <g transform="translate(155, 0)">
        <rect x="-48" y="-18" width="96" height="36" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="1.8" />
        <circle cx="-26" cy="0" r="5" fill="#10B981" />
        <text x="-12" y="6" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="900" fill="#BBF7D0">KB</text>
      </g>
    </g>

    <!-- BOTTOM SUBTEXT: MISSION-CRITICAL SUPPORT -->
    <text x="400" y="780"
          font-family="'Noto Sans', 'Segoe UI', system-ui, sans-serif"
          font-size="21" font-weight="900"
          letter-spacing="4"
          text-anchor="middle"
          fill="#38BDF8">SUPPORT HERO • EXPO 2026</text>

    <!-- Small Tech Stamp -->
    <text x="400" y="822"
          font-family="'Noto Sans', monospace, sans-serif"
          font-size="16" font-weight="800"
          letter-spacing="2.5"
          text-anchor="middle"
          fill="#94A3B8">200 OK — TICKET RESOLVED</text>
  </g>
</svg>