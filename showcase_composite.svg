  <text x="800" y="88" font-family="'Noto Sans Mono', monospace" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="3" text-anchor="middle">PILLOWY DIE-CUT CONTOURS • SYMMETRICAL T • 300 DPI PREPRESS READY</text>

