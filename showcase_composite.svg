<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200">
  <defs>
    <!-- Background Gradient (Space Gray Matte Aluminum Finish) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141C31" />
      <stop offset="60%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#04060C" />
    </radialGradient>

    <!-- Subtle Dot Grid for Tech Feel -->
    <pattern id="gridDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#334155" opacity="0.4" />
    </pattern>

    <!-- Sticker Shadow Filter -->
    <filter id="stickerDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#gridDots)" />

  <!-- HEADER -->
  <g transform="translate(900, 110)">
    <text x="0" y="0" font-family="'Noto Sans', system-ui, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TIXDESK • EXPO MERCHANDISE PACK</text>
    <text x="0" y="42" font-family="'Noto Sans Mono', monospace" font-size="16" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="4">4 DISTINCT ART STYLES // DIE-CUT VINYL EDITIONS</text>
    <line x1="-350" y1="65" x2="350" y2="65" stroke="#334155" stroke-width="2" />
  </g>

  <!-- ================= GRID OF 4 STICKERS ================= -->

  <!-- CARD 1: THE PURE HERO DIE-CUT (TOP LEFT) -->
  <g transform="translate(480, 420)">
    <!-- Info Badge -->
    <rect x="-360" y="-180" width="720" height="380" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <text x="-330" y="-135" font-family="'Noto Sans Mono', monospace" font-size="14" font-weight="900" fill="#38BDF8" letter-spacing="2">01 // THE PURE HERO DIE-CUT</text>
    <text x="-330" y="-112" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Official Minimalist Ticket • Organic Contour</text>
    <rect x="230" y="-150" width="100" height="28" rx="14" fill="#065F46" />
    <text x="280" y="-132" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="800" fill="#34D399" text-anchor="middle">APPROVED ✓</text>

    <!-- Sticker Graphic -->
    <g transform="translate(0, 45) scale(1.05)" filter="url(#stickerDrop)">
      <image href="/home/graha/tixdesk-expo-stickers/assets/png/tixdesk-sticker-01-hero-mark-300dpi.png" x="-150" y="-130" width="300" height="260" />
    </g>
  </g>

  <!-- CARD 2: TIXIE THE CYBER-BOT MASCOT (TOP RIGHT) -->
  <g transform="translate(1320, 420)">
    <rect x="-360" y="-180" width="720" height="380" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <text x="-330" y="-135" font-family="'Noto Sans Mono', monospace" font-size="14" font-weight="900" fill="#38BDF8" letter-spacing="2">02 // TIXIE • THE CYBER-BOT</text>
    <text x="-330" y="-112" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Kawaii Helpdesk Mascot • Golden Ticket &amp; Headset</text>
    <rect x="210" y="-150" width="120" height="28" rx="14" fill="#1E3A8A" />
    <text x="270" y="-132" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="800" fill="#60A5FA" text-anchor="middle">NEW MASCOT ★</text>

    <!-- Sticker Graphic -->
    <g transform="translate(0, 35) scale(0.55)" filter="url(#stickerDrop)">
      <image href="/home/graha/tixdesk-expo-stickers/assets/png/tixdesk-sticker-02-mascot-tixie-300dpi.png" x="-300" y="-300" width="600" height="600" />
    </g>
  </g>

  <!-- CARD 3: CYBER MECHA TACTICAL DECAL (BOTTOM LEFT) -->
  <g transform="translate(480, 870)">
    <rect x="-360" y="-180" width="720" height="380" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <text x="-330" y="-135" font-family="'Noto Sans Mono', monospace" font-size="14" font-weight="900" fill="#38BDF8" letter-spacing="2">03 // CYBER MECHA DECAL // UNIT-016</text>
    <text x="-330" y="-112" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Anime Tactical HUD • Zero Overdue SLA • Chamfered Shield</text>
    <rect x="220" y="-150" width="110" height="28" rx="14" fill="#78350F" />
    <text x="275" y="-132" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">MECHA TECH ⚡</text>

    <!-- Sticker Graphic -->
    <g transform="translate(0, 35) scale(0.52)" filter="url(#stickerDrop)">
      <image href="/home/graha/tixdesk-expo-stickers/assets/png/tixdesk-sticker-03-cyber-mecha-decal-300dpi.png" x="-300" y="-300" width="600" height="600" />
    </g>
  </g>

  <!-- CARD 4: RETRO 16-BIT ARCADE GAMER (BOTTOM RIGHT) -->
  <g transform="translate(1320, 870)">
    <rect x="-360" y="-180" width="720" height="380" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <text x="-330" y="-135" font-family="'Noto Sans Mono', monospace" font-size="14" font-weight="900" fill="#38BDF8" letter-spacing="2">04 // RETRO 16-BIT ARCADE GAMER</text>
    <text x="-330" y="-112" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Nostalgic 8-Bit Pixel Character • Full Hearts • 100% SLA</text>
    <rect x="220" y="-150" width="110" height="28" rx="14" fill="#831843" />
    <text x="275" y="-132" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="800" fill="#F472B6" text-anchor="middle">RETRO PIXEL 🕹️</text>

    <!-- Sticker Graphic -->
    <g transform="translate(0, 35) scale(0.52)" filter="url(#stickerDrop)">
      <image href="/home/graha/tixdesk-expo-stickers/assets/png/tixdesk-sticker-04-retro-pixel-arcade-300dpi.png" x="-300" y="-300" width="600" height="600" />
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(900, 1140)">
    <text x="0" y="0" font-family="'Noto Sans Mono', monospace" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">READY FOR PRODUCTION • 300 DPI TRANSPARENT PNG • SVG MASTER • CUTCONTOUR PDF READY</text>
  </g>
</svg>