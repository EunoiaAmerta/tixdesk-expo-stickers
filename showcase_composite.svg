<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <!-- Dark Matte Laptop Texture / Expo Surface -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Expo Header Badge -->
  <g transform="translate(800, 70)" text-anchor="middle">
    <text font-family="'Noto Sans', sans-serif" font-size="24" font-weight="900" letter-spacing="3" fill="#38BDF8">TIXDESK OFFICIAL EXPO STICKER TRIO</text>
    <text y="30" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1.5">300 DPI PREPRESS DIE-CUT PACK • SPOT MAGENTA CUTLINES</text>
  </g>

  <!-- Sticker 01: Hero Mark (Permanent Locked) -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="440" height="490" rx="20" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
    <text x="220" y="42" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle">01. HERO MARK (PERMANENT)</text>
    <text x="220" y="62" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Symmetrical 40px T • Contour-Following Tail</text>
    <g transform="translate(220, 260) scale(0.95)" filter="url(#stickerShadow)">
      <image href="assets/png/tixdesk-sticker-01-hero-mark-300dpi.png" x="-209" y="-209" width="418" height="418" />
    </g>
  </g>

  <!-- Sticker 02: Kawaii Chibi Mascot Head -->
  <g transform="translate(580, 140)">
    <rect x="0" y="0" width="440" height="490" rx="20" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
    <text x="220" y="42" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle">02. CHIBI TIXIE (HEAD ONLY)</text>
    <text x="220" y="62" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Preserved Notches • Solid White Gap Fill</text>
    <g transform="translate(220, 260) scale(0.85)" filter="url(#stickerShadow)">
      <image href="assets/png/tixdesk-sticker-02-mascot-tixie-300dpi.png" x="-247" y="-247" width="494" height="494" />
    </g>
  </g>

  <!-- Sticker 03: Retro Pixel Arcade Pure Character -->
  <g transform="translate(1080, 140)">
    <rect x="0" y="0" width="440" height="490" rx="20" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
    <text x="220" y="42" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle">03. RETRO PIXEL ARCADE</text>
    <text x="220" y="62" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">8-Bit Pixel Ticket • Cool Sunglasses &amp; Blush</text>
    <g transform="translate(220, 260) scale(0.92)" filter="url(#stickerShadow)">
      <image href="assets/png/tixdesk-sticker-03-retro-pixel-arcade-300dpi.png" x="-230" y="-230" width="460" height="460" />
    </g>
  </g>
</svg>